name: Package Geumseong v10 assets

on:
  push:
    paths:
      - '.github/workflows/package_geumseong_v10_assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record run id
        run: |
          echo "${{ github.run_id }}" > public/geumseong-v10-refs/PACKAGE_RUN_ID.txt
          git config user.name 'geumseong-archive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/geumseong-v10-refs/PACKAGE_RUN_ID.txt
          git commit -m 'Record Geumseong v10 package workflow run' || true
          git push || true
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: geumseong-v10-assets-package
          path: |
            public/geumseong-assets
            public/geumseong-v10-refs
          retention-days: 7
          if-no-files-found: error
