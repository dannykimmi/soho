name: Package public-domain persimmon watercolor

on:
  push:
    paths:
      - '.github/workflows/package_persimmon_pd.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record run id
        run: |
          mkdir -p public/geumseong-v11-assets
          echo "$GITHUB_RUN_ID" > public/geumseong-v11-assets/PERSIMMON_RUN_ID.txt
          git config user.name 'geumseong-archive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/geumseong-v11-assets/PERSIMMON_RUN_ID.txt
          git commit -m 'Record persimmon asset package run' || true
          git push || true
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: persimmon-watercolor-pd
          path: public/geumseong-v11-assets/persimmon_watercolor_pd.jpg
          retention-days: 7
          if-no-files-found: error
