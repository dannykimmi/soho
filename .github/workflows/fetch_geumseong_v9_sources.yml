name: Fetch Geumseong v9 Source References

on:
  push:
    paths:
      - '.github/workflows/fetch_geumseong_v9_sources.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Download source-reference images
        run: |
          cat > /tmp/fetch_v9.py <<'PY'
          import io, json, shutil
          from pathlib import Path
          import requests
          from PIL import Image

          out = Path('v9_sources')
          shutil.rmtree(out, ignore_errors=True)
          out.mkdir(parents=True)

          s = requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/125 Safari/537.36',
            'Accept-Language':'ko-KR,ko;q=0.9,en;q=0.7',
          })
          items = [
            ('water_carrier_jibs','https://www.jibs.co.kr/image/common/2022/12/09/20221209160750271djPIalUXwT.jpg','https://www.jibs.co.kr/news/articles/articlesDetail/27104','제주 물허벅 생활사 사진'),
            ('spring_well_jejusori','https://cdn.jejusori.net/news/photo/201901/214130_249768_5751.jpg','https://www.jejusori.net/news/articleView.html?idxno=214130','제주의 옛 물자리·샘 사진'),
            ('stone_wall_commons','https://commons.wikimedia.org/wiki/Special:Redirect/file/Jeju%20traditional%20stone%20walls%20woljeongri%20jeju%20korea.jpg','https://commons.wikimedia.org/wiki/File:Jeju_traditional_stone_walls_woljeongri_jeju_korea.jpg','제주 전통 돌담, CC BY-SA 4.0'),
            ('hanji_artisan_commons','https://commons.wikimedia.org/wiki/Special:Redirect/file/%ED%95%9C%EC%A7%80%EC%9E%A5.jpg','https://commons.wikimedia.org/wiki/File:%ED%95%9C%EC%A7%80%EC%9E%A5.jpg','한지 뜨기 장인, CC BY-SA 2.5'),
            ('hanji_sheet_commons','https://commons.wikimedia.org/wiki/Special:Redirect/file/Korean%20paper-Hanji-02.jpg','https://commons.wikimedia.org/wiki/File:Korean_paper-Hanji-02.jpg','한지 완성지, public domain'),
            ('galot_actual','https://img1.yna.co.kr/etc/inner/KR/2023/08/04/AKR20230804106700056_10_i_P4.jpg','https://www.yna.co.kr/view/AKR20230804106700056','제주 갈옷 실제 사진, 교정용'),
            ('persimmon_crushing','https://img0.yna.co.kr/etc/inner/KR/2023/08/04/AKR20230804106700056_11_i_P4.jpg','https://www.yna.co.kr/view/AKR20230804106700056','풋감 부수는 작업, 교정용'),
            ('galcheon_drying','https://img9.yna.co.kr/etc/inner/KR/2023/08/04/AKR20230804106700056_05_i_P4.jpg','https://www.yna.co.kr/view/AKR20230804106700056','갈천 말리는 모습, 교정용'),
            ('galot_drying','https://img1.yna.co.kr/photo/yna/YH/2016/02/02/PYH2016020216260005600_P4.jpg','https://www.yna.co.kr/view/AKR20230804106700056','건조되는 갈옷, 교정용'),
          ]
          manifest=[]
          for key,url,source,note in items:
            try:
              r=s.get(url,headers={'Referer':source},timeout=90,allow_redirects=True)
              r.raise_for_status()
              im=Image.open(io.BytesIO(r.content)); im.load()
              if im.width<300 or im.height<200:
                raise RuntimeError(f'image too small {im.size}')
              p=out/f'{key}.jpg'
              im.convert('RGB').save(p,quality=94,optimize=True,progressive=True)
              manifest.append({'key':key,'file':p.name,'url':url,'final_url':r.url,'source':source,'note':note,'width':im.width,'height':im.height,'status':'ok'})
              print('OK',key,im.size,r.url)
            except Exception as e:
              manifest.append({'key':key,'url':url,'source':source,'note':note,'status':'failed','error':repr(e)})
              print('FAIL',key,repr(e))
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          ok=sum(x['status']=='ok' for x in manifest)
          print('OK COUNT',ok)
          if ok<6: raise SystemExit('too few images downloaded')
          PY
          python /tmp/fetch_v9.py

      - name: Record workflow run ID
        run: |
          echo "$GITHUB_RUN_ID" > v9_sources/RUN_ID.txt

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: geumseong-v9-sources
          path: v9_sources
          retention-days: 7
          if-no-files-found: error

      - name: Commit run ID
        run: |
          mkdir -p public/geumseong-v9
          cp v9_sources/RUN_ID.txt public/geumseong-v9/RUN_ID.txt
          cp v9_sources/manifest.json public/geumseong-v9/manifest.json
          git config user.name 'geumseong-v9-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/geumseong-v9
          git diff --cached --quiet && exit 0
          git commit -m 'Record Geumseong v9 source-reference workflow'
          git push
