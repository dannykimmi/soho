name: Fetch Geumseong Archive Assets

on:
  push:
    paths:
      - '.github/workflows/fetch_geumseong_assets.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare Python
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow beautifulsoup4

      - name: Download maps and editorial reference images
        run: |
          cat > /tmp/fetch_assets.py <<'PY'
          import io, json, os, re, time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          OUT = Path('assets_out')
          OUT.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/125 Safari/537.36',
              'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
              'Accept-Language': 'ko-KR,ko;q=0.9,en;q=0.7',
          })

          manifest = []

          def safe_name(s):
              return re.sub(r'[^0-9A-Za-z._-]+', '_', s).strip('_')

          def fetch_bytes(url, referer=None, timeout=45):
              headers = {'Referer': referer} if referer else {}
              r = session.get(url, headers=headers, timeout=timeout, allow_redirects=True)
              r.raise_for_status()
              return r.content, r.headers.get('content-type',''), r.url

          def save_image(key, url, source_page=None, note='', required=False):
              try:
                  data, ctype, final_url = fetch_bytes(url, source_page)
                  img = Image.open(io.BytesIO(data))
                  img.load()
                  # preserve alpha only for PNG; otherwise RGB JPEG
                  if img.mode not in ('RGB','RGBA'):
                      img = img.convert('RGB')
                  ext = '.png' if img.mode == 'RGBA' else '.jpg'
                  path = OUT / f'{safe_name(key)}{ext}'
                  if ext == '.png':
                      img.save(path, optimize=True)
                  else:
                      img.convert('RGB').save(path, quality=92, optimize=True, progressive=True)
                  manifest.append({'key':key,'path':str(path),'url':url,'final_url':final_url,'source_page':source_page,'note':note,'width':img.width,'height':img.height,'status':'ok'})
                  print('OK', key, img.size, final_url)
                  return path
              except Exception as e:
                  manifest.append({'key':key,'url':url,'source_page':source_page,'note':note,'status':'failed','error':repr(e)})
                  print('FAIL', key, url, repr(e))
                  if required:
                      raise
                  return None

          def save_esri_map(key, service, bbox, size=(2400,1600), fmt='jpg', note=''):
              base = f'https://server.arcgisonline.com/ArcGIS/rest/services/{service}/MapServer/export'
              params = {
                  'bbox': ','.join(map(str,bbox)), 'bboxSR':'4326', 'imageSR':'4326',
                  'size': f'{size[0]},{size[1]}', 'format': fmt, 'f':'image',
                  'dpi':'200'
              }
              try:
                  r = session.get(base, params=params, timeout=90)
                  r.raise_for_status()
                  img = Image.open(io.BytesIO(r.content)); img.load()
                  path = OUT / f'{key}.jpg'
                  img.convert('RGB').save(path, quality=94, optimize=True, progressive=True)
                  manifest.append({'key':key,'path':str(path),'url':r.url,'source_page':base,'note':note,'width':img.width,'height':img.height,'status':'ok'})
                  print('OK MAP', key, img.size)
                  return path
              except Exception as e:
                  manifest.append({'key':key,'url':base,'note':note,'status':'failed','error':repr(e)})
                  print('FAIL MAP', key, repr(e))
                  return None

          # Actual basemap / satellite images. Bboxes are WGS84 and cover the official Geumseong-ri boundary and coastal village.
          save_esri_map('map_satellite_legal_full', 'World_Imagery', [126.2965,33.4195,126.3145,33.4505], (2400,3000), note='Esri World Imagery; full legal-ri area')
          save_esri_map('map_satellite_coastal', 'World_Imagery', [126.2950,33.4415,126.3105,33.4510], (2600,1700), note='Esri World Imagery; coastal settlement')
          save_esri_map('map_street_coastal', 'World_Street_Map', [126.2950,33.4415,126.3105,33.4510], (2600,1700), note='Esri World Street Map; coastal settlement')
          save_esri_map('map_topographic_full', 'World_Topo_Map', [126.2920,33.4140,126.3200,33.4540], (2400,3000), note='Esri World Topographic Map; wider context')
          save_esri_map('map_satellite_port_close', 'World_Imagery', [126.2950,33.4440,126.3035,33.4502], (2400,1750), note='Esri World Imagery; Geumseong Port close-up')

          visit_page = 'https://www.visitjeju.net/kr/detail/view?contentsid=CNTS_000000000021517'
          visit_imgs = [
              'https://api.cdn.visitjeju.net/photomng/imgpath/201804/30/5944c57c-f187-4c78-a255-13c0864d3352.webp',
              'https://api.cdn.visitjeju.net/photomng/imgpath/201804/30/cabfb895-21bf-46a4-9b9f-d6e0dac22198.webp',
              'https://api.cdn.visitjeju.net/photomng/imgpath/201908/23/e40ab98c-bb6a-4867-95a7-251747f08fe9.webp',
              'https://api.cdn.visitjeju.net/photomng/imgpath/201908/23/3a387c3a-1df2-45e0-bc03-5607ced3ea34.webp',
              'https://api.cdn.visitjeju.net/photomng/imgpath/201908/23/8a0bad16-0630-4457-8f71-39e3adf6e9a7.webp',
          ]
          for i,u in enumerate(visit_imgs,1):
              save_image(f'visitjeju_geumseong_port_{i:02d}', u, visit_page, 'VisitJeju Geumseong Port photograph')

          church_page = 'https://www.christiantoday.co.kr/news/364110'
          save_image('old_geumseong_church', 'https://images.christiantoday.co.kr/data/images/full/369600/image.jpg', church_page, 'Old Geumseong Church editorial photograph')

          yna_page = 'https://www.yna.co.kr/view/AKR20110504170100056'
          yna_imgs = [
              'https://img7.yna.co.kr/photo/yna/YH/2011/05/04/PYH2011050410600005600_P4.jpg',
              'https://img1.yna.co.kr/photo/yna/YH/2011/05/04/PYH2011050410620005600_P4.jpg',
              'https://img0.yna.co.kr/photo/yna/YH/2011/05/04/PYH2011050410520005600_P4.jpg',
          ]
          for i,u in enumerate(yna_imgs,1):
              save_image(f'yonhap_geumseong_excavation_{i:02d}', u, yna_page, 'Yonhap excavation editorial photograph')

          # Crawl article images for editorial proof. Only image files are saved; every item retains source URL in manifest.
          pages = {
              'jejusori_2024':'https://www.jejusori.net/news/articleView.html?idxno=429001',
              'sceneofjeju':'https://workshop.town/sceneofjeju',
              'christiantoday':'https://www.christiantoday.co.kr/news/364110',
              'yonhap':'https://www.yna.co.kr/view/AKR20110504170100056',
              'jst_galot':'https://www.jst.re.kr/galot/archiveList.do?cid=2102&curPage=19',
              'jst_detail_95664':'https://www.jst.re.kr/jejustudiesDetail.do?cid=060100&mid=RC00095664',
          }
          for prefix,page in pages.items():
              try:
                  html, ctype, final = fetch_bytes(page)
                  (OUT/f'{prefix}.html').write_bytes(html)
                  soup=BeautifulSoup(html,'html.parser')
                  urls=[]
                  for tag in soup.find_all(['img','source']):
                      for attr in ('src','data-src','data-original','data-lazy-src','srcset'):
                          val=tag.get(attr)
                          if not val: continue
                          for item in str(val).split(','):
                              u=item.strip().split(' ')[0]
                              if not u or u.startswith('data:'): continue
                              u=urljoin(final,u)
                              if u not in urls: urls.append(u)
                  # OpenGraph image first
                  for meta in soup.find_all('meta'):
                      if meta.get('property') in ('og:image','og:image:url') and meta.get('content'):
                          u=urljoin(final,meta['content'])
                          if u not in urls: urls.insert(0,u)
                  count=0
                  for idx,u in enumerate(urls,1):
                      low=u.lower()
                      if not any(x in low for x in ('.jpg','.jpeg','.png','.webp','.gif','image','photo','upload')): continue
                      p=save_image(f'{prefix}_{idx:03d}',u,page,f'Image discovered from {page}')
                      if p:
                          try:
                              im=Image.open(p)
                              if im.width < 360 or im.height < 240:
                                  p.unlink(missing_ok=True)
                                  manifest[-1]['status']='discarded_small'
                              else:
                                  count+=1
                          except Exception: pass
                      if count>=20: break
                  print('CRAWL',prefix,'saved',count,'from',len(urls))
              except Exception as e:
                  manifest.append({'key':prefix,'url':page,'status':'page_failed','error':repr(e)})
                  print('PAGE FAIL',prefix,repr(e))

          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          ok=sum(1 for x in manifest if x.get('status')=='ok')
          print('TOTAL OK',ok,'TOTAL RECORDS',len(manifest))
          if ok < 10:
              raise SystemExit('Too few assets downloaded')
          PY
          python /tmp/fetch_assets.py

      - name: Upload Geumseong assets
        uses: actions/upload-artifact@v4
        with:
          name: geumseong-assets
          path: assets_out
          retention-days: 7
          if-no-files-found: error
